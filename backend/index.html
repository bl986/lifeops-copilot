<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeOps OS | AI Portfolio Copilot</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 600px; background: #1e293b; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: flex; flex-direction: column; overflow: hidden; height: 80vh; }
        .chat-header { background: #334155; padding: 20px; font-weight: 600; font-size: 1.1rem; border-bottom: 1px solid #475569; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 80%; line-height: 1.5; }
        .user { background: #3b82f6; align-self: flex-end; color: white; }
        .assistant { background: #334155; align-self: flex-start; color: #e2e8f0; border: 1px solid #475569; }
        .chat-input { display: flex; padding: 15px; background: #1e293b; border-top: 1px solid #475569; }
        .chat-input input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; font-size: 1rem; }
        .chat-input button { background: #3b82f6; color: white; border: none; padding: 0 20px; margin-left: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .chat-input button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">🤖 LifeOps OS - AI Portfolio Copilot</div>
        <div class="chat-messages" id="messages">
            <div class="message assistant">Hello! I'm Bowen's AI portfolio copilot. Ask me about professional experience, GCP projects, or system tasks.</div>
        </div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Ask about my background, projects, or tasks..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const messages = document.getElementById('messages');
            const text = input.value.trim();
            if (!text) return;

            messages.innerHTML += <div class="message user"></div>;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                messages.innerHTML += <div class="message assistant"></div>;
            } catch (err) {
                messages.innerHTML += <div class="message assistant" style="color: #ef4444;">Error connecting to agent server.</div>;
            }
            messages.scrollTop = messages.scrollHeight;
        }
        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
