<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeOps OS | AI Portfolio Copilot</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <span class="status-dot"></span>
        <span>LifeOps OS - AI Portfolio Copilot</span>
    </div>
    <div id="messages" class="chat-messages">
        <div class="message-row assistant">
            <div class="avatar">AI</div>
            <div class="message-content">Hello! I'm Bowen's AI portfolio copilot. Ask me about professional experience, GCP projects, or how this app was built.</div>
        </div>
    </div>
    <div class="chat-input-area">
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="Ask about Bowen's experience and projects..." autocomplete="off">
            <button type="button" id="sendBtn" class="send-btn" aria-label="Send">
                <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
